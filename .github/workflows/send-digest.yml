name: Send AI Builders Digest

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      DIGEST_TIMEZONE: Europe/Dublin
      DIGEST_DELIVERY_TIME: "07:00"
      DIGEST_FROM: "AI Builders Digest <digest@digest.yianz.me>"
      OPENAI_MODEL: gpt-5.4-mini
      OPENAI_REASONING_EFFORT: medium
      DIGEST_PROMPT_VERSION: ai-digest-yian-style-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Configure delivery
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "Missing RESEND_API_KEY repository secret" >&2
            exit 1
          fi

          mkdir -p "$HOME/.follow-builders"
          cat > "$HOME/.follow-builders/config.json" <<JSON
          {
            "platform": "github-actions",
            "language": "zh",
            "timezone": "$DIGEST_TIMEZONE",
            "frequency": "daily",
            "deliveryTime": "$DIGEST_DELIVERY_TIME",
            "delivery": {
              "method": "email",
              "from": "$DIGEST_FROM",
              "emails": [
                "yian.zhou2024@hotmail.com",
                "wenyig@umich.edu",
                "goran229@126.com",
                "EmmaLu0317@outlook.com"
              ]
            },
            "onboardingComplete": true
          }
          JSON
          {
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            if [ -n "$OPENAI_API_KEY" ]; then
              printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            fi
            printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL"
            printf 'OPENAI_REASONING_EFFORT=%s\n' "$OPENAI_REASONING_EFFORT"
            printf 'DIGEST_PROMPT_VERSION=%s\n' "$DIGEST_PROMPT_VERSION"
          } > "$HOME/.follow-builders/.env"

      - name: Generate and send briefing
        run: cd scripts && node prepare-digest.js | node generate-briefing.js | node deliver.js
